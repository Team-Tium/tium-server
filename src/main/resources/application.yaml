spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tium
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  ##추가
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4.1-nano
      embedding:
        model: text-embedding-3-small
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: spring-ai-openai-document-index
        dimensions: 1536
        similarity: cosine

  elasticsearch:
    uris: http://localhost:9200 # 로컬 도커로 띄운 상용 엘라스틱서치 서버 주소


app:
  rag:
    # 파일여러개를 추가할수있음
    flow-cases-location: classpath:feedbackCritera.json
    keyword-enricher:
      enabled: falsec
  etl:
    pipeline:
      init: false





server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-N/A} %logger{36} - %msg%n"


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:14d}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:}
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
