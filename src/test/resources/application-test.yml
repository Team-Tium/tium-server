spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:tium-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      url: redis://localhost:6379

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWNpLXRlc3QtZW52aXJvbm1lbnQtMTIzNDU2Nzg5MA==
  access-token-expiration: 30m
  refresh-token-expiration: 14d

app:
  etl:
    pipeline:
      init: false
