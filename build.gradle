plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.studio-rent'
version = '0.0.1-SNAPSHOT'
description = 'tium'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'


    implementation("org.springframework.ai:spring-ai-vector-store:2.0.0-M6")
    implementation("org.springframework.ai:spring-ai-rag:2.0.0-M6")
    implementation("org.springframework.ai:spring-ai-starter-model-openai:2.0.0-M6")
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live-api'
    }
    systemProperty 'spring.profiles.active', 'test'
}

// 명시적으로 실행할 때만 실제 OpenAI API를 호출한다. 일반 test/CI에서는 제외한다.
tasks.register('liveApiTest', Test) {
    description = 'Runs opt-in tests against the real OpenAI API using a local key.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live-api'
    }
    // 예: -PpreviewCase=requested_advice 로 미리보기의 특정 사례만 실행한다.
    systemProperty 'preview.case', providers.gradleProperty('previewCase').orElse('all').get()
    // 이전 성공 결과를 재사용하지 않고 명시적인 실행마다 연결을 확인한다.
    outputs.upToDateWhen { false }
}


ext {
    set('springAiVersion', "2.0.0-M6")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

